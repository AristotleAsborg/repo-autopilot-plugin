# 步骤 0.1 产出物：harness 能力探测
#
# 规矩（路线 0.1 的易错点）：不要凭工具列表"看起来有"就写 true —— 必须实际调一次。
# 本文件每条都注明探测方式与实测证据。
# 生成：准备轮对话。平台：Windows / Windows PowerShell 5.1（无 pwsh）。

github_write: true           # 写 token 已就位且可认证（写能力本身未验证，按路线 0.3 要求推迟）
github_write_reason: "人类提供 fine-grained PAT，存于仓库根 github-write-token.txt；规范落点应为 state/.write_token"
github_read: true            # 实测：GET /user 200，配额 5000/hr
github_probe_2026_09_11:     # 见 state/reports/github-probe.log、credentials-check.log
  reachable_anonymous: true  # GET /rate_limit 匿名 200
  read_auth: true            # GET /user 200 -> AristotleAsborg
  read_token_visible_repos: 2
  write_token_verified: read_only   # 只做 GET 认证，未做任何写操作
  note: "401 不是断联，属未经认证，不要按 OFFLINE 处理（路线易错点 12）"

github_account:
  login: AristotleAsborg
  type: User
  visible_repos:
    - name: dsh-example-token-balance
      private: true
      origin: "由 dsh-pipeline 生成、人类于 2026-09-11 14:32 手动推送"
      note: "上一轮那个 Node/npm 发布管线示例；与本系统无依赖关系"
    - name: local-headroom-service-in-deepseekharness
      private: false
      license: Apache-2.0
      origin: "人类的 headroom 插件工作"

# 本机安全约束（实测，影响 1.4 闸门与 0.3 的权限要求）
security_constraints:
  acl_hardening_impossible: |
    DSH 沙箱创建的文件，所有者是 AppContainer SID (S-1-4-1036951774-83913762)，
    不是交互用户。`icacls /inheritance:r` 与 `/grant:r` 均返回 Access is denied，
    因此 POSIX 0600 在本机无法通过 ACL 实现。实测写 token 文件为 mode 0o666，
    ACL 另含 NT AUTHORITY\Authenticated Users 与 BUILTIN\Users（继承而来）。
    兜底是沙箱自身的隔离，但**严格意义上不满足路线的 0600 要求**，已如实记录。
  token_plaintext_leak_incident: |
    一次脱敏函数写错（Python 的 s[-0:] 等价于整个字符串），把完整写 token 写进
    了未被 git 跟踪的 reports/ 日志。教训已固化为 test_credentials.py 的第 4 项
    检查：明文扫描必须同时覆盖"跟踪文件 + 工作区文件"，只扫跟踪文件会漏掉这类泄漏。
  secrets_in_session_log: |
    两个 token 都曾以明文出现在对话中（人类粘贴读 token；上述事故泄漏写 token）。
    DSH 会话日志会落盘。**建议在本阶段收尾后轮换这两个 token**，或至少在
    上线前更换。此项不阻塞构建，但必须在上线检查表里有位置。

local_model_reachable: true  # 实测：127.0.0.1:11434 可达
local_model_pulled: true     # 实测：qwen3:4b (2.5GB) 与 bge-m3:latest (1.2GB) 均已就位
local_model_probe:
  endpoint: "http://127.0.0.1:11434"
  deployment_shape: "形态一（dsh 直装宿主机）"   # 路线 0.1 的三种形态中最省事的那种
  models_installed: ["qwen3:4b", "bge-m3:latest"]
  # 命名陷阱（实测）：Ollama 把 embedding 模型注册为 `bge-m3:latest`，不是 `bge-m3`。
  # 路线 0.2 警告"必须与 ollama list 输出逐字符一致（含 :tag），否则 404"。
  json_compliance: true      # 实测：要求"只回复JSON"时严格遵从，无多余文字
  thinking_chain: problem    # 实测：think=false 在 OpenAI 兼容端点无效，见下
  # 实测四个抑制手段（state/reports/think-suppression.log）：
  #   不传 think      → 11.2s / 833 token / 思考链 1548 字 / JSON ok
  #   think=false     → 11.2s / 833 token / 思考链 1548 字 / JSON ok（完全没生效）
  #   prompt+/no_think→  8.1s / 602 token / 思考链 1088 字 / JSON ok（唯一有效）
  #   原生端点 think=false → 22.8s / 1267 token / 思考链 0 字 / JSON 解析失败
  # 这正是路线易错点 6 警告的情形：推理模型做分类拖慢。模型选型待 0.2 的
  # 准确率验收数据出来后再定，不凭延迟单独决定。

cron_available: true         # 部署内含 @deepseek-ai/dsh-schedule 包（实测目录存在）
cron_in_this_session: false  # 但当前 preset 的工具清单里没有 schedule 工具
cron_note: "路线第十一部分的现实修正（cron 轮询 + 对话唤起）在架构上成立；能否在本会话注册定时器待验证"

persistent_fs: true          # 实测：上一会话建的文件本会话直接读到

docker_available: false      # 实测：docker 命令不可用
sandbox_fallback: "venv + setrlimit（路线 1.5 的降级方案）"
sandbox_strength: weak       # 按 1.5 要求在此标注；红队演练的逃逸项相应跳过

git:
  version: "2.47.1.windows.1"
  local_ops: true            # 实测：init/add/commit/log/tag/branch/diff 全通
  push_local_path: false     # 实测：git 传输进程被沙箱阻断（CreateFileMapping Win32 error 5）
  push_file_url: false       # 同上，file:// 也一样
  push_remote: unknown       # 未测；需要凭据，属 0.3 范畴
  note: "本地 push 被阻断是环境边界，不是配置问题。真实终端里可跑通。"

python:
  # 关键约束：python 命令指向 uv 托管的解释器，PEP 668 保护，装不了包
  command_python: "D:\\PythonEnv\\uv\\cpython-3.12.13-windows-x86_64-none\\python.exe"
  python_version: "3.12.13"
  usable_venv: "D:\\PythonEnv\\venv\\Scripts\\python.exe"   # pip 25.0.1 可用
  venv_creation: false       # 实测：python -m venv 建成但 ensurepip 失败 → 无 pip
  pip_install: escalated     # 实测被沙箱拒（.whl 读不回）；已申请提权，见 reports/
  pip_present:
    pydantic: true
    httpx: true
    numpy: true
    yaml: true
  pip_missing: ["tenacity", "pytest", "ruff", "mypy"]
  note: "pytest 是全部验收的判定工具；缺它则 TEST_GATE 无法运转（路线 0.2 / 第八部分）"

disk:
  d_available_gb: 240.3
  d_total_gb: 361.3
  note: "C: 取不到（WMI 权限受限）。qwen3:4b 2.5GB + bge-m3 约 1.2GB，空间充裕。"

harness_security:
  # 路线 0.2 要求的告知项，也是 1.4 的设计约束来源
  audit_status: "官方声明尚未安全审计；已有沙箱逃逸与 /api 无鉴权 PoC"
  binding_constraint: "本系统的闸门与写 token 隔离必须独立实现，不得依赖 dsh 自带审批环"
  bind_scope: "127.0.0.1 单用户主机"

platform:
  os: windows
  shell: "Windows PowerShell 5.1（无 pwsh）"
  shell_impact: |
    影响两处：① 所有 .ps1 必须带 UTF-8 BOM，否则 PS 5.1 按 ANSI 读中文会报假语法错误；
    ② 自研系统本体是 Python，不受此限，但外围脚本要注意。
