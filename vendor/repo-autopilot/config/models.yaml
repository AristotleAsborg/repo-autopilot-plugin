# 模型分档配置（路线 1.3 子步骤 1 的规定内容）
#
# 约定（路线 0.4 + 2.2）：
#   - 生成/计划/diff/评分理由 → flash 档（需要强模型）
#   - 分类/打标/摘要/打分/停止判断/文件定位 → 本地小模型（判断题，高频低价，断网可用）
#   - 分类与打分**一律温度 0**；禁止用推理模型做分类（JSON 输出不稳，路线易错点 6）
#
# 与路线的差异（实测调整，非擅自改动）：
#   1. 模型 id 必须与 `ollama list` 输出逐字符一致。实测 Ollama 把 embedding 模型
#      注册为 `bge-m3:latest`（不是路线写的 `bge-m3`），qwen3 则是 `qwen3:4b`。
#      路线 0.2 警告过：id 不一致会 404。
#   2. flash 档的 model 名待确认：路线写 deepseek-v4.1-flash，实际可用的模型 id
#      需在 1.3 实现时从 DSH 模型目录核对后再定，先留占位。

tiers:
  local_small:
    # 注意：这里**没有** /v1 后缀。本机档位走 Ollama 原生 /api/chat，
    # 因为结构化输出必须带 format:"json"（见 src/gateway/local_client.py 的实测表：
    # 0.4s/20 token vs 16s/1121 token）。路线写的 base_url 带 /v1，那是 OpenAI
    # 兼容面；本机档位不用它。api_style 显式写出来，换模型时只改配置不改代码。
    base_url: "http://127.0.0.1:11434"
    model: "qwen3:4b"
    temperature: 0
    api_style: "ollama"
    # 路线 0.2 警告：contextWindow 必须 ≤ 运行时实际配置，虚高会触发 output token limit 报错
    context_window: 40960
    max_tokens: 8192

  flash_api:
    base_url: "https://api.deepseek.com/v1"
    # 2026-09-12 用 tools/probe_flash.py 实测核对：这个端点只提供
    # `deepseek-flash` 与 `deepseek-v4-pro`。路线里写的 deepseek-v4.1-flash
    # **不存在** —— 它一直是个没核对的占位值，真调用会 404。
    model: "deepseek-flash"
    temperature: 0.2
    api_style: "openai"

embed:
  # 用哪个 embedding 档位。改这一行即可切换，**不用改代码**。
  #   local = 本机 Ollama + bge-m3（默认，断网可用、不花钱、不外发数据）
  #   api   = OpenAI 兼容的 /embeddings 端点（没有显卡 / 不想常驻 Ollama / 想用更强的模型时）
  # 档位名写错会**响亮报错**，不会静默退回 local。
  active: "local"

  local:
    base_url: "http://127.0.0.1:11434"   # 同 local_small：原生端点，不带 /v1
    model: "bge-m3:latest"   # 实测：Ollama 注册名带 :latest 后缀
    api_style: "ollama"
    # 路线 0.2 验收要求：embedding 返回 1024 维；同义句余弦 >0.8，无关句 <0.5
    # 配了 dim 就**硬校验**：实际维度对不上直接报错，而不是让 dedup 阈值静默失效。
    dim: 1024

  # ---------------------------------------------------------------- API 替代接法
  # 启用步骤：
  #   1. 把 API key 放进**环境变量** DEEPSEEK_API_KEY，或写到 $DSH_HOME/.deepseek_key（首行）。
  #      —— **不要**写进本文件：config/ 是进 git 的，key 一旦提交，历史里删不掉，只能轮换。
  #   2. 把下面的 base_url / model / dim 改成你的服务商实际值。
  #   3. 把上面的 `active` 改成 "api"。
  #
  # ⚠️ 换 embedding 模型**必须重标定** dedup 阈值（本文件末尾那两条），
  #    不得沿用 bge-m3 标出来的 0.98 / 0.92 —— 不同模型的余弦分布不一样。
  #    dim 要和模型真实维度一致；对不上会直接报错（这是故意的）。
  #
  # ⚠️ 数据会被发到 base_url 指向的第三方：本系统的查重/文件定位会把
  #    issue 正文、文件路径与片段送去做 embedding。涉密仓库请留在 local 档。
  api:
    base_url: "https://api.deepseek.com/v1"   # 换成你自己的 OpenAI 兼容端点
    model: "your-embedding-model"             # 换成服务商实际的 embedding 模型 id
    api_style: "openai"
    dim: 1024                                 # 必须与该模型真实维度一致

# 查重阈值（路线 2.2.1）：这两个值是拿 BGE-M3 类模型调出来的。
# 换 embedding 模型必须重标定，不得沿用默认值。
dedup:
  suggest_close: 0.98    # >0.98 才自动建议关闭（该动作仍需过闸门）
  cluster: 0.92          # 聚类阈值
