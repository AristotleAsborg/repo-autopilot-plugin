# 本插件包作为 profile 层的补丁：往 profile 里插入**一行**，装载本插件。
#
# 行 `name` 解析的是**包名**：`dsh plugin --profile <名字> add <本目录>` 之后，
# 本包会被装进那个 profile 的 node_modules，于是这一行能解析到它，并取它的 `main`
# （`lib/index.js`）导出的 `apply` 作为 Cordis 插件。
#
# 两种装载方式共用同一份实现（不 fork）：
#   * 本文件 + `lib/index.js` —— profile 层，装完重启即生效；
#   * `host.js` 全文喂给 `cordis_define` —— dynamic Package，可热更。
#   `lib/index.js` 由 `scripts/build_module.py` 从 `host.js` **生成**，两者一致由用例钉住。
#
# 能力边界：本插件只注册**只读**工具（doctor / drill / acceptance / compare），
# 不注册任何写操作，也不读取任何凭证；repo-autopilot 的写能力属于它自己的闸门流程。

- insert:
    - id: repo-autopilot-plugin
      name: 'repo-autopilot-plugin'
