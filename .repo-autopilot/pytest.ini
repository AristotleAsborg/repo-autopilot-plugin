[pytest]
# 为什么关掉 cacheprovider：本机沙箱拒绝创建 `.tmp` 后缀的文件（实测 WinError 5），
# 而 pytest 的 cacheprovider 恰好要写 `pytest-cache-files-*.tmp`。换 cache_dir 没用——
# 被拒的是后缀，不是路径。本项目不需要 pytest 缓存，且按路线"验收要粘贴关键段落"，
# 每次挂一条警告会稀释证据可读性。
#
# 不用 pytest 的 tmp_path：它的 tmpdir 插件在本机沙箱下不可用
# （系统临时目录禁写；换 basetemp 又会被建成自己都读不了的目录）。
# 测试改用 tests/conftest.py 里的 scratch/state_dir 夹具，自行在工作区内建目录。
addopts = -q -p no:cacheprovider

# 测试发现范围：只认 tests/ 下的 test_*.py，避免把 state/vendor/ 里抓来的
# 第三方项目副本当成我们的测试（路线 1.1 规定 vendor 目录存在）。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = state src .cache .pip-tmp
