# 8.4 门禁自动化（路线第八部分）—— 装到本系统与每个被管仓库
#
# 四道关的顺序是有讲究的：
#   ① 路径黑名单 → ② 测试完整性 → ③ 全量测试 → ④ lint/类型
# 前两关是"**先确认这次改动有没有作弊**"，后两关才是"改动本身对不对"。
# 顺序反过来的话，一个改了测试的补丁会先跑出一片绿，然后再被拦 —— 但那时人已经看过绿灯了。
#
# 【2026-09-12 两处修正】
#   1. 依赖清单跟着 tests 的实际 import 走：漏了 httpx / jsonschema / typing_extensions
#      会在 import 阶段就 ImportError，看起来像"测试挂了"，其实是门禁自己没装齐（实测踩过）。
#   2. `runs-on` 改 **windows**：本系统的沙箱是 Windows 专用（Job Object / ctypes.wintypes），
#      在 Linux 上跑 `pytest` 只会得到"平台不支持"的假红；门禁要测的是**部署目标平台**。
#   3. `|| true` 在 Windows runner 的 pwsh 里不是"忽略失败"（`true` 不是命令），
#      所以类型检查改用 `continue-on-error: true` 表达"报告但不阻断"。
name: autopilot-gate

on: [pull_request]

jobs:
  gate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 要跟 base 比较，浅克隆不够

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 路径黑名单检查
        run: python scripts/check_blacklist.py

      - name: 测试完整性检查
        run: python scripts/check_test_integrity.py

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic httpx jsonschema numpy pytest ruff mypy PyYAML typing_extensions

      - name: 全量测试
        run: python -m pytest -x --tb=short -q

      - name: lint
        run: python -m ruff check .

      - name: 类型（报告但不阻断）
        run: python -m mypy .
        # 老代码的类型债还没还完（2026-09-12 量化：119 个错误 / 49 个文件）。
        # 阻断会让门禁长期红着，而长期红的门禁等于没有门禁 —— 还完债就删掉这一行。
        continue-on-error: true
