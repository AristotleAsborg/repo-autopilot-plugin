name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 依赖只有测试用的 pyyaml，加上 smoke/install 要检查的三个模块。
      - name: 装依赖
        run: python -m pip install --upgrade pip pytest pyyaml requests numpy

      - name: 包自检
        run: python -m pytest -q

      # 自包含的底线：随插件打包的那份 repo-autopilot 必须**逐文件 sha256** 与它自己的
      # MANIFEST.json 一致。这条红了就说明"自带副本"被改过或没带上。
      - name: 自带副本完整性
        run: python scripts/install.py --repo-root vendor/repo-autopilot

      - name: 冒烟自检（默认查自带副本）
        run: python scripts/smoke.py

      # 生成一份 host.local.js 并检查它只改了一行 —— 装的时候靠的就是它。
      - name: --emit-host 可用
        run: python scripts/install.py --emit-host
