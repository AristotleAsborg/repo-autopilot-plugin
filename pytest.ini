[pytest]
# 本仓库的测试**不要用 pytest 内建的 `tmp_path` / `tmpdir`**，用 `tests/` 里的 `scratch` 夹具。
#
# 原因（2026-09-18 实测，不是推测）：
#   pytest 默认把临时目录建在**系统临时目录**，那在会话工作区**之外**，harness 的文件沙箱
#   会直接拒绝（`PermissionError: [WinError 5]`）。被拒之后 pytest 会在**当前目录**留下
#   `pytest-cache-files-*` 残渣，而那些目录的 ACL 属于沙箱的受限主体 —— 普通用户连列目录都被拒，
#   **删也删不掉**（本目录下现在就有两个这样的残渣）。
#
# 试过 `--basetemp=.cache/pytest-tmp`：**也没用，而且更糟**。`--basetemp` 的设计前提是
# 跨次运行复用，于是第二次运行要去列那个目录 —— 同样被 ACL 拒绝，直接把会话打挂，
# 还留下第三个删不掉的目录。所以这里**不设 basetemp**。
#
# `scratch` 夹具是安全的：它在**同一个进程里**创建并删除，不跨运行残留。
addopts = -p no:cacheprovider
testpaths = tests
